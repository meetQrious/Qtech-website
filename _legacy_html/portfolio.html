<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Portfolio | Qrious Tech Team LLP</title>
    <meta
      name="description"
      content="Explore Qrioustech Team LLP's project portfolio. View detailed web, mobile, cloud, healthcare, ecommerce, finance, community, and workforce management projects."
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="/css/style.css" rel="stylesheet" />
    <link href="/css/responsive.css" rel="stylesheet" />
    <link href="/css/header.css" rel="stylesheet" />
    <link rel="shortcut icon" href="/images/favicon.png" type="image/x-icon" />
    <link rel="icon" href="/images/favicon.png" type="image/x-icon" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"

    <style>
      /* ============================================
       PORTFOLIO HERO & WRAPPER
       ============================================ */
      .portfolio-hero {
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        overflow: hidden;
        padding: 80px 0 64px;
        position: relative;
      }

      .portfolio-hero::after {
        background: linear-gradient(90deg, #ed693a 0%, #f43f5e 100%);
        bottom: 0;
        content: "";
        height: 4px;
        left: 0;
        position: absolute;
        right: 0;
      }

      .portfolio-eyebrow {
        color: #ed693a;
        display: inline-flex;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.15em;
        margin-bottom: 16px;
        text-transform: uppercase;
      }

      .portfolio-hero h1 {
        color: #ffffff;
        font-size: 48px;
        font-weight: 800;
        line-height: 1.15;
        margin-bottom: 20px;
        max-width: 850px;
        letter-spacing: -0.02em;
      }

      .portfolio-hero p {
        color: rgba(255, 255, 255, 0.76);
        font-size: 16px;
        line-height: 1.8;
        margin-bottom: 0;
        max-width: 760px;
      }

      .portfolio-wrap {
        background: #f8fafc;
        padding: 64px 0 90px;
      }

      .portfolio-intro {
        display: grid;
        gap: 32px;
        grid-template-columns: minmax(0, 1fr) 340px;
        margin-bottom: 48px;
        align-items: center;
      }

      .portfolio-intro h2 {
        color: #0f172a;
        font-size: 32px;
        font-weight: 800;
        line-height: 1.25;
        margin-bottom: 12px;
        letter-spacing: -0.01em;
      }

      .portfolio-intro p {
        color: #475569;
        font-size: 15px;
        line-height: 1.75;
        margin: 0;
        max-width: 740px;
      }

      .portfolio-note {
        background: #ffffff;
        border-left: 4px solid #ed693a;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.02);
        color: #64748b;
        font-size: 13.5px;
        line-height: 1.7;
        padding: 20px 24px;
        border-radius: 0 4px 4px 0;
      }

      /* ============================================
       RESPONSIVE CARD GRID
       ============================================ */
      .portfolio-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
        gap: 30px;
      }

      .project-card {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        box-shadow: 0 4px 20px rgba(15, 23, 42, 0.03);
        display: flex;
        flex-direction: column;
        height: 100%;
        overflow: hidden;
        position: relative;
        transition:
          transform 0.3s cubic-bezier(0.4, 0, 0.2, 1),
          box-shadow 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        border-radius: 8px;
      }

      .project-card:hover {
        box-shadow: 0 16px 36px rgba(15, 23, 42, 0.08);
        transform: translateY(-8px);
      }

      .project-media {
        background: #f1f5f9;
        aspect-ratio: 16/10;
        overflow: hidden;
        position: relative;
        border-bottom: 1px solid #e2e8f0;
      }

      .project-media img {
        height: 100%;
        object-fit: cover;
        width: 100%;
        transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .project-card:hover .project-media img {
        transform: scale(1.04);
      }

      .project-year {
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(4px);
        color: #ffffff;
        font-size: 12px;
        font-weight: 700;
        left: 16px;
        padding: 6px 12px;
        position: absolute;
        top: 16px;
        border-radius: 4px;
      }

      .project-content {
        display: flex;
        flex-direction: column;
        padding: 28px;
        flex-grow: 1;
      }

      .project-meta {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 12px;
      }

      .project-domain,
      .project-context {
        display: inline-flex;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.08em;
        line-height: 1;
        padding: 6px 10px;
        text-transform: uppercase;
        border-radius: 4px;
      }

      .project-domain {
        background: #fff1ec;
        color: #ed693a;
      }

      .project-context {
        background: #f1f5f9;
        color: #475569;
      }

      .project-title {
        color: #0f172a;
        font-size: 24px;
        font-weight: 800;
        line-height: 1.25;
        margin-bottom: 10px;
        letter-spacing: -0.015em;
      }

      .project-summary {
        color: #475569;
        font-size: 14.5px;
        line-height: 1.65;
        margin-bottom: 18px;
        flex-grow: 1;
      }

      /* Key Features Snippet */
      .project-features-list {
        margin: 0 0 20px;
        padding: 0;
        list-style: none;
        border-top: 1px dashed #e2e8f0;
        padding-top: 16px;
      }

      .project-features-list li {
        color: #64748b;
        font-size: 13px;
        line-height: 1.5;
        margin-bottom: 6px;
        padding-left: 20px;
        position: relative;
      }

      .project-features-list li::before {
        color: #ed693a;
        content: "\f00c";
        font-family: "Font Awesome 6 Free";
        font-size: 10px;
        font-weight: 900;
        left: 0;
        position: absolute;
        top: 2px;
      }

      .project-stack {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 24px;
      }

      .project-stack span {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        color: #475569;
        font-size: 11px;
        font-weight: 600;
        padding: 5px 8px;
        border-radius: 4px;
      }

      .project-actions {
        align-items: center;
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: auto;
        width: 100%;
      }

      .project-link {
        align-items: center;
        background: #ed693a;
        color: #ffffff;
        display: inline-flex;
        font-size: 13px;
        font-weight: 700;
        gap: 8px;
        letter-spacing: 0.05em;
        padding: 12px 0;
        justify-content: center;
        text-transform: uppercase;
        transition: all 0.25s ease;
        width: 100%;
        border-radius: 4px;
        text-decoration: none;
      }

      .project-link:hover {
        background: #0f172a;
        color: #ffffff;
        text-decoration: none;
      }

      .privacy-text {
        color: #94a3b8;
        font-size: 11px;
        line-height: 1.4;
        margin: 0;
        text-align: center;
      }

      @media (max-width: 991px) {
        .portfolio-intro {
          grid-template-columns: 1fr;
          gap: 24px;
        }

        .portfolio-hero h1 {
          font-size: 38px;
        }
      }

      @media (max-width: 575px) {
        .portfolio-hero {
          padding: 56px 0 44px;
        }

        .portfolio-hero h1 {
          font-size: 32px;
        }

        .portfolio-intro h2 {
          font-size: 26px;
        }

        .project-content {
          padding: 24px;
        }

        .project-title {
          font-size: 22px;
        }
      }

      .cs-hero {
        background: #ffffff;
        padding: 60px 0 40px;
      }

      .cs-hero-title {
        font-size: 48px;
        font-weight: 800;
        color: #1a1a2e;
        line-height: 1.15;
        margin-bottom: 16px;
      }

      .cs-hero-title span {
        color: #ed693a;
      }

      .cs-hero-subtitle {
        font-size: 16px;
        color: #666;
        line-height: 1.75;
        max-width: 720px;
        margin: 0 auto 10px;
      }
    </style>
  </head>

  <body>

    <script

    <script src="/js/custom-script.js"></script>

    <script>
      $(function () {
        $("#footer").load("/footer.html");
        $("#header").load("/header.html");
      });

      $(document).ready(function () {
        $.getJSON("/data/portfolio-projects.json", function (projects) {
          if (!projects || projects.length === 0) {
            $("#portfolio-list").html(
              '<div class="alert alert-info text-center py-5">No projects available at the moment.</div>',
            );
            return;
          }

          $("#portfolio-list").html(
            projects
              .map(
                (project) => `
          <article class="project-card wow fadeInUp" data-wow-delay="100ms">
            <div class="project-media">
              <img src="${project.image}" alt="${project.name} ${project.category} interface" />
            </div>
            <div class="project-content">
              <div class="project-meta">
                <span class="project-domain">${project.domain}</span>
                <span class="project-context">${project.originalContext}</span>
              </div>
              <h3 class="project-title">${project.name}</h3>
              <p class="project-summary">${project.summary}</p>

              <ul class="project-features-list">
                ${project.features
                  .slice(0, 3)
                  .map((feature) => `<li>${feature}</li>`)
                  .join("")}
              </ul>

              <div class="project-stack">
                ${project.technologies
                  .slice(0, 4)
                  .map((tech) => `<span>${tech}</span>`)
                  .join("")}
              </div>

              <div class="project-actions">
                <a class="project-link" href="/portfolio/${project.id}">
                  View Project Details <i class="fa-solid fa-arrow-right-long"></i>
                </a>
              </div>
            </div>
          </article>
        `,
              )
              .join(""),
          );

          if (typeof WOW !== "undefined") {
            new WOW().init();
          }
        }).fail(function () {
          $("#portfolio-list").html(
            '<div class="alert alert-danger text-center py-5">Portfolio projects could not be loaded.</div>',
          );
        });
      });
    </script>
