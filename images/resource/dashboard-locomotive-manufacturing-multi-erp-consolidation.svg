<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <style>
      .text-title { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 700; fill: #ffffff; font-size: 11px; }
      .text-category { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 600; fill: #ed693a; font-size: 8px; letter-spacing: 0.1em; text-transform: uppercase; }
      .text-kpi-val { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 800; fill: #ed693a; font-size: 24px; }
      .text-kpi-lbl { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 600; fill: #6b80a4; font-size: 9px; letter-spacing: 0.05em; text-transform: uppercase; }
      .text-axis { font-family: monospace; fill: #6b80a4; font-size: 8px; }
      .grid-line { stroke: #1c2b48; stroke-width: 1; stroke-dasharray: 4 4; opacity: 0.5; }
    </style>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060a13" />
      <stop offset="100%" stop-color="#0b1220" />
    </linearGradient>
    <linearGradient id="chartAreaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ed693a" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ed693a" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="12" fill="url(#bgGrad)" stroke="#1c2b48" stroke-width="2" />
  <line x1="60" y1="0" x2="60" y2="450" stroke="#1c2b48" stroke-width="1" opacity="0.3" />
  <line x1="0" y1="45" x2="800" y2="45" stroke="#1c2b48" stroke-width="1" opacity="0.3" />

  <!-- Sidebar Icons -->
  <g opacity="0.6">
    <circle cx="30" cy="30" r="10" fill="#ed693a" opacity="0.2" />
    <path d="M26,30 A4,4 0 1,1 34,30 A4,4 0 1,1 26,30" fill="none" stroke="#ed693a" stroke-width="2" />
    <path d="M25,85 L35,85 L35,95 L31,95 L31,90 L29,90 L29,95 L25,95 Z M23,87 L30,80 L37,87" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round" />
    <rect x="24" y="125" width="4" height="12" fill="none" stroke="#ffffff" stroke-width="1.5" />
    <rect x="30" y="120" width="4" height="17" fill="none" stroke="#ffffff" stroke-width="1.5" />
    <rect x="36" y="130" width="4" height="7" fill="none" stroke="#ffffff" stroke-width="1.5" />
  </g>

  <!-- Top Navigation Header -->
  <g>
    <circle cx="85" cy="22" r="5" fill="#ff5f56" />
    <circle cx="97" cy="22" r="5" fill="#ffbd2e" />
    <circle cx="109" cy="22" r="5" fill="#27c93f" />
    <text x="135" y="18" class="text-category">Global Enterprise Data Warehousing</text>
    <text x="135" y="32" class="text-title">Locomotive Manufacturing: Multi-ERP Consol...</text>
    <rect x="680" y="12" width="95" height="20" rx="10" fill="#ed693a" opacity="0.15" />
    <text x="727" y="25" font-family="'Inter', sans-serif" font-weight="700" fill="#ed693a" font-size="9" text-anchor="middle">FINANCIAL REPORT</text>
  </g>

  <!-- Left Side: 3 KPI Cards Stacked -->
  <g transform="translate(85, 65)">
    <rect width="180" height="75" rx="6" fill="#0f182b" stroke="#1c2b48" stroke-width="1" />
    <line x1="0" y1="0" x2="0" y2="75" stroke="#ed693a" stroke-width="4" />
    <text x="15" y="32" class="text-kpi-val">20+</text>
    <text x="15" y="52" class="text-kpi-lbl">ERP Sources Unified</text>
    
    <g transform="translate(0, 95)">
      <rect width="180" height="75" rx="6" fill="#0f182b" stroke="#1c2b48" stroke-width="1" />
      <line x1="0" y1="0" x2="0" y2="75" stroke="#00e5c3" stroke-width="4" />
      <text x="15" y="32" class="text-kpi-val">100%</text>
      <text x="15" y="52" class="text-kpi-lbl">Validated Data</text>
    </g>
    
    <g transform="translate(0, 190)">
      <rect width="180" height="75" rx="6" fill="#0f182b" stroke="#1c2b48" stroke-width="1" />
      <line x1="0" y1="0" x2="0" y2="75" stroke="#ed693a" stroke-width="4" />
      <text x="15" y="32" class="text-kpi-val">Auto</text>
      <text x="15" y="52" class="text-kpi-lbl">Flow Ingestion</text>
    </g>
  </g>

  <!-- Right Side: Trend Area Chart -->
  <g transform="translate(285, 65)">
    <rect width="490" height="265" rx="8" fill="#0f182b" stroke="#1c2b48" stroke-width="1" />
    <text x="20" y="28" font-family="'Inter', sans-serif" font-weight="700" fill="#ffffff" font-size="12">Temporal Performance &amp; Revenue Trends</text>
    
    <g transform="translate(40, 50)" opacity="0.6">
      <line x1="0" y1="0" x2="410" y2="0" class="grid-line" />
      <line x1="0" y1="40" x2="410" y2="40" class="grid-line" />
      <line x1="0" y1="80" x2="410" y2="80" class="grid-line" />
      <line x1="0" y1="120" x2="410" y2="120" class="grid-line" />
      <line x1="0" y1="160" x2="410" y2="160" stroke="#1c2b48" stroke-width="1.5" />
      
      <text x="-10" y="4" class="text-axis" text-anchor="end">100%</text>
      <text x="-10" y="44" class="text-axis" text-anchor="end">75%</text>
      <text x="-10" y="84" class="text-axis" text-anchor="end">50%</text>
      <text x="-10" y="124" class="text-axis" text-anchor="end">25%</text>
      <text x="-10" y="164" class="text-axis" text-anchor="end">0%</text>
      
      <text x="10" y="180" class="text-axis" text-anchor="middle">Q1</text>
      <text x="90" y="180" class="text-axis" text-anchor="middle">Q2</text>
      <text x="170" y="180" class="text-axis" text-anchor="middle">Q3</text>
      <text x="250" y="180" class="text-axis" text-anchor="middle">Q4</text>
      <text x="330" y="180" class="text-axis" text-anchor="middle">PROJ</text>
      <text x="400" y="180" class="text-axis" text-anchor="middle">MAX</text>
      
      <path d="M10,160 L10,120 Q50,70 90,105 Q130,130 170,60 Q210,10 250,40 Q290,70 330,30 Q370,-5 400,15 L400,160 Z" fill="url(#chartAreaGrad)" />
      <path d="M10,120 Q50,70 90,105 Q130,130 170,60 Q210,10 250,40 Q290,70 330,30 Q370,-5 400,15" fill="none" stroke="#ed693a" stroke-width="3.5" stroke-linecap="round" />
      <circle cx="170" cy="60" r="5" fill="#ffffff" stroke="#ed693a" stroke-width="2.5" />
      <circle cx="250" cy="40" r="5" fill="#ffffff" stroke="#ed693a" stroke-width="2.5" />
    </g>
  </g>

  <!-- Bottom Panel -->
  <g transform="translate(85, 345)">
    <rect width="180" height="85" rx="6" fill="#0f182b" stroke="#1c2b48" stroke-width="1" />
    <circle cx="45" cy="42" r="24" fill="none" stroke="#1c2b48" stroke-width="6" />
    <circle cx="45" cy="42" r="24" fill="none" stroke="#ed693a" stroke-width="6" stroke-dasharray="120 150" stroke-linecap="round" transform="rotate(-90 45 42)" />
    <text x="45" y="47" font-family="'Inter', sans-serif" font-weight="800" fill="#ffffff" font-size="12" text-anchor="middle">85%</text>
    <text x="85" y="38" font-family="'Inter', sans-serif" font-weight="700" fill="#ffffff" font-size="10">Margin Goal</text>
    <text x="85" y="52" font-family="'Inter', sans-serif" fill="#6b80a4" font-size="8">Operational Target</text>
  </g>
  <g transform="translate(285, 345)">
    <rect width="235" height="85" rx="6" fill="#0f182b" stroke="#1c2b48" stroke-width="1" />
    <text x="15" y="22" font-family="'Inter', sans-serif" font-weight="700" fill="#ffffff" font-size="9" letter-spacing="0.055em" text-transform="uppercase">Transaction Volumes</text>
    <text x="15" y="42" class="text-axis">Domestic</text>
    <rect x="75" y="35" width="130" height="8" rx="4" fill="#1c2b48" />
    <rect x="75" y="35" width="115" height="8" rx="4" fill="#ed693a" />
    <text x="15" y="62" class="text-axis">Overseas</text>
    <rect x="75" y="55" width="130" height="8" rx="4" fill="#1c2b48" />
    <rect x="75" y="55" width="60" height="8" rx="4" fill="#00e5c3" />
  </g>
  <g transform="translate(540, 345)">
    <rect width="235" height="85" rx="6" fill="#0f182b" stroke="#1c2b48" stroke-width="1" />
    <text x="15" y="22" font-family="'Inter', sans-serif" font-weight="700" fill="#ffffff" font-size="9" letter-spacing="0.055em" text-transform="uppercase">Validation Summary</text>
    <circle cx="22" cy="45" r="4" fill="#00e5c3" />
    <text x="35" y="48" font-family="'Inter', sans-serif" font-weight="600" fill="#ffffff" font-size="9">COMPLIANCE: VERIFIED</text>
    <circle cx="22" cy="65" r="4" fill="#ed693a" />
    <text x="35" y="68" font-family="'Inter', sans-serif" font-weight="600" fill="#ffffff" font-size="9">AUDIT STATUS: 100% PASS</text>
  </g>
</svg>