<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Portfolio Project | Qrious Tech Team LLP</title>
    <meta
      name="description"
      content="Detailed Qrioustech project portfolio page."
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="/css/style.css" rel="stylesheet" />
    <link href="/css/responsive.css" rel="stylesheet" />
    <link href="/css/header.css" rel="stylesheet" />
    <link rel="shortcut icon" href="/images/favicon.png" type="image/x-icon" />
    <link rel="icon" href="/images/favicon.png" type="image/x-icon" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"
    />

    <style>
      /* ============================================
       CENTERED HERO & OVERLAPPING LANDING DESIGN
       ============================================ */
      .pd-hero {
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        padding: 80px 0 160px;
        position: relative;
        text-align: center;
      }

      .pd-hero::after {
        background: linear-gradient(90deg, #ed693a 0%, #f43f5e 100%);
        bottom: 0;
        content: "";
        height: 4px;
        left: 0;
        position: absolute;
        right: 0;
      }

      .pd-back {
        align-items: center;
        color: rgba(255, 255, 255, 0.78);
        display: inline-flex;
        font-size: 13px;
        font-weight: 800;
        gap: 8px;
        letter-spacing: 0.06em;
        margin-bottom: 28px;
        text-transform: uppercase;
      }

      .pd-back:hover {
        color: #ffffff;
        text-decoration: none;
      }

      .pd-hero-container {
        max-width: 800px;
        margin: 0 auto;
      }

      .pd-eyebrow {
        color: #ed693a;
        display: inline-flex;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.12em;
        margin-bottom: 16px;
        text-transform: uppercase;
      }

      .pd-hero h1 {
        color: #ffffff;
        font-size: 44px;
        font-weight: 800;
        line-height: 1.2;
        margin-bottom: 20px;
        letter-spacing: -0.015em;
      }

      .pd-hero p {
        color: rgba(255, 255, 255, 0.74);
        font-size: 16.5px;
        line-height: 1.8;
        margin-bottom: 0;
      }

      .pd-wrap {
        background: #f8fafc;
        padding: 0 0 80px;
      }

      /* Floating Image Overlap */
      .pd-visual-wrap {
        margin-top: -110px;
        margin-bottom: 48px;
        position: relative;
        z-index: 10;
        display: flex;
        justify-content: center;
      }

      .pd-visual {
        background: #ffffff;
        box-shadow: 0 20px 50px rgba(15, 23, 42, 0.12);
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        overflow: hidden;
        max-width: 800px;
        width: 100%;
        transition: transform 0.3s ease;
      }

      .pd-visual img {
        display: block;
        width: 100%;
        height: auto;
      }

      /* Metrics Centered grid */
      .pd-metrics {
        display: grid;
        gap: 20px;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        margin-bottom: 44px;
      }

      .pd-metric {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        box-shadow: 0 4px 12px rgba(15, 23, 42, 0.02);
        padding: 24px;
        border-radius: 6px;
        text-align: center;
      }

      .pd-metric strong {
        color: #ed693a;
        display: block;
        font-size: 32px;
        font-weight: 800;
        line-height: 1;
        margin-bottom: 8px;
      }

      .pd-metric span {
        color: #64748b;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      /* Swapped Columns (Left Sidebar, Right Content) */
      .pd-layout {
        display: grid;
        gap: 36px;
        grid-template-columns: 320px minmax(0, 1fr);
        align-items: start;
      }

      .pd-panel {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        box-shadow: 0 4px 15px rgba(15, 23, 42, 0.02);
        margin-bottom: 30px;
        padding: 36px;
        border-radius: 8px;
      }

      .pd-panel h2 {
        color: #0f172a;
        font-size: 24px;
        font-weight: 800;
        margin-bottom: 18px;
        letter-spacing: -0.01em;
      }

      .pd-panel p {
        color: #475569;
        font-size: 15.5px;
        line-height: 1.75;
        margin-bottom: 16px;
      }

      .pd-panel p:last-child {
        margin-bottom: 0;
      }

      /* Features 2-column Grid */
      .pd-list {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        margin: 0;
        padding: 0;
      }

      .pd-list li {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        color: #334155;
        font-size: 13.5px;
        line-height: 1.5;
        list-style: none;
        padding: 14px 14px 14px 42px;
        position: relative;
        border-radius: 6px;
      }

      .pd-list li::before {
        color: #ed693a;
        content: "\f00c";
        font-family: "Font Awesome 6 Free";
        font-size: 11px;
        font-weight: 900;
        left: 16px;
        position: absolute;
        top: 17px;
      }

      /* Sidebar metadata elements */
      .pd-sidebar {
        align-self: start;
        position: sticky;
        top: 24px;
      }

      .pd-side-card {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        box-shadow: 0 4px 15px rgba(15, 23, 42, 0.02);
        margin-bottom: 24px;
        padding: 28px;
        border-radius: 8px;
      }

      .pd-side-card h2 {
        color: #0f172a;
        font-size: 15px;
        font-weight: 800;
        margin-bottom: 14px;
        letter-spacing: -0.01em;
        text-transform: uppercase;
      }

      .pd-stack {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .pd-stack span {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        color: #475569;
        font-size: 11.5px;
        font-weight: 600;
        padding: 6px 10px;
        border-radius: 4px;
      }

      .pd-confidential {
        border-left: 4px solid #ed693a;
        color: #64748b;
        font-size: 13px;
        line-height: 1.65;
        background: #ffffff;
        border-radius: 0 8px 8px 0;
      }

      .pd-error {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        margin: 60px auto;
        max-width: 760px;
        padding: 42px;
        text-align: center;
        border-radius: 8px;
      }

      .pd-error h1 {
        color: #0f172a;
        font-size: 30px;
        font-weight: 800;
        margin-bottom: 14px;
      }

      .pd-error p {
        color: #64748b;
        line-height: 1.7;
        margin-bottom: 24px;
      }

      /* Responsiveness */
      @media (max-width: 991px) {
        .pd-layout {
          grid-template-columns: 1fr;
          gap: 24px;
        }

        .pd-sidebar {
          position: static;
        }

        .pd-hero h1 {
          font-size: 36px;
        }

        .pd-visual-wrap {
          margin-top: -80px;
          padding: 0 16px;
        }
      }

      @media (max-width: 575px) {
        .pd-hero h1 {
          font-size: 28px;
        }

        .pd-metrics,
        .pd-list {
          grid-template-columns: 1fr;
        }

        .pd-panel,
        .pd-side-card {
          padding: 24px;
        }
      }
    </style>
  </head>

  <body>
    <div class="page-wrapper">
      <div class="preloader">
        <div class="icon"></div>
      </div>
      <div id="header"></div>
      <main id="project-root"></main>
      <section class="full-width half-padding"></section>
      <div id="footer"></div>
    </div>

    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.js"
      integrity="sha512-+k1pnlgt4F1H8L7t3z95o3/KO+o78INEcXTbnoJQ/F2VqDVhWoaiVml/OEHv9HsVgxUaVW+IbiZPUJQfF/YxZw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script src="/js/scrollbar.js"></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/2.9.2/umd/popper.min.js"
      integrity="sha512-2rNj2KJ+D8s1ceNasTIex6z4HWyOnEYLVC3FigGOmyQCZc2eBXKgOxQmo3oKLHyfcj53uz4QMsRCWNbLd32Q1g=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.min.js"
      integrity="sha512-ykZ1QQr0Jy/4ZkvKuqWn4iF3lqPZyij9iRv6sGqLRdTPkY69YX6+7wvVGmsdBbiIfN/8OdsI7HABjvEok6ZopQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.14.1/jquery-ui.js"
      integrity="sha512-ETeDoII5o/Zv6W1AtLiNDwfdkH684h6M/S8wd2N0vMEAeL3UAOf7a1SHdP1LGDieDrofe1KZpp9k6yLkR90E6A=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/fancybox/3.5.7/jquery.fancybox.js"
      integrity="sha512-j7/1CJweOskkQiS5RD9W8zhEG9D9vpgByNGxPIqkO5KrXrwyDAroM9aQ9w8J7oRqwxGyz429hPVk/zR6IOMtSA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/owl.carousel.js"
      integrity="sha512-gY25nC63ddE0LcLPhxUJGFxa2GoIyA5FLym4UJqHDEMHjp8RET6Zn/SHo1sltt3WuVtqfyxECP38/daUc/WVEA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/jquery-mousewheel/3.1.12/jquery.mousewheel.js"
      integrity="sha512-4YGNovJrl6Qk98aRC7DThxWJt+7+wDIqV2ldbIbjQ/WOYOaYInFuS8U4niSTyFL+T8gPuioZ5OOwRY495oUPWw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.21.0/jquery.validate.js"
      integrity="sha512-iH/pDSVxvLhkkjp/iRv71KHJ16zsIyFtzG2YnQrmofmOK6W7EQekpGcMymyimL964E5XqxioscKLmvv5d6MGzQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/jquery-appear/0.1/jquery.appear.js"
      integrity="sha512-gmlF0Cjvx6n5XCLF9NNN+rZwS3X0Xn1vwuk+K0L3B4qve4UI+RVbNt0VynWadl//O0VQ8X47GH55KF9j3kVdUw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/wow/1.1.2/wow.js"
      integrity="sha512-Rd5Gf5A6chsunOJte+gKWyECMqkG8MgBYD1u80LOOJBfl6ka9CtatRrD4P0P5Q5V/z/ecvOCSYC8tLoWNrCpPg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script src="/js/custom-script.js"></script>

    <script>
      $(function () {
        $("#footer").load("/footer.html");
        $("#header").load("/header.html");
      });

      function getProjectId() {
        const parts = window.location.pathname.split("/").filter(Boolean);
        return parts[1] || "";
      }

      function renderProject(project) {
        document.title = `${project.name} | Portfolio | Qrious Tech Team LLP`;
        $("#project-root").html(`
        <section class="pd-hero">
          <div class="max-width">
            <div class="pd-hero-container">
              <div>
                <h1>${project.name}</h1>
                <p>${project.summary}</p>
              </div>
            </div>
          </div>
        </section>

        <section class="pd-wrap">
          <div class="max-width">
            <div class="pd-visual-wrap">
              <div class="pd-visual">
                <img src="${project.image}" alt="${project.name} ${project.category} interface" />
              </div>
            </div>

            <div class="pd-metrics">
              ${project.metrics
                .map(
                  (metric) => `
                <div class="pd-metric">
                  <strong>${metric.value}</strong>
                  <span>${metric.label}</span>
                </div>
              `,
                )
                .join("")}
            </div>

            <div class="pd-layout">
              <aside class="pd-sidebar">
                <div class="pd-side-card">
                  <h2>Project Type</h2>
                  <div class="pd-stack">
                    <span>${project.category}</span>
                    <span>${project.originalContext}</span>
                    <span>${project.domain}</span>
                  </div>
                </div>

                <div class="pd-side-card">
                  <h2>Technologies &amp; Tools</h2>
                  <div class="pd-stack">
                    ${project.technologies.map((item) => `<span>${item}</span>`).join("")}
                  </div>
                </div>

              </aside>

              <div>
                <section class="pd-panel">
                  <h2>Overview</h2>
                  ${project.overview.map((item) => `<p>${item}</p>`).join("")}
                </section>

                <section class="pd-panel">
                  <h2>Technical Overview</h2>
                  ${project.technicalOverview.map((item) => `<p>${item}</p>`).join("")}
                </section>

                <section class="pd-panel">
                  <h2>Key Features</h2>
                  <ul class="pd-list">
                    ${project.features.map((feature) => `<li>${feature}</li>`).join("")}
                  </ul>
                </section>
              </div>
            </div>
          </div>
        </section>
      `);
      }

      function renderNotFound() {
        $("#project-root").html(`
        <section class="pd-wrap" style="padding-top: 100px;">
          <div class="pd-error">
            <h1>Project Not Found</h1>
            <p>The portfolio project ID in this URL does not match an available project.</p>
            <a class="theme-btn btn-style-one" href="/portfolio">
              <span class="btn-title">Back to Portfolio</span>
            </a>
          </div>
        </section>
      `);
      }

      $(document).ready(function () {
        $.getJSON("/data/portfolio-projects.json", function (projects) {
          const project = projects.find((item) => item.id === getProjectId());
          project ? renderProject(project) : renderNotFound();
        }).fail(renderNotFound);
      });
    </script>
  </body>
</html>
